services:
  naiah-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naiah-agent
    restart: unless-stopped
    ports:
      # Vincula à porta 4000 na interface local (127.0.0.1) para o CloudPanel (Nginx)
      - "127.0.0.1:4000:8000"
    env_file:
      - .env
    volumes:
      # Monta a pasta de conhecimento para permitir adicionar/atualizar PDFs sem reconstruir o container
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
